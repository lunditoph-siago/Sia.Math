name: Benchmark

on:
  workflow_dispatch:
    inputs:
      include_high_priority:
        description: Include HighPriority benchmarks
        type: boolean
        default: true
      include_normal:
        description: Include Normal-priority benchmarks
        type: boolean
        default: true
      include_low_priority:
        description: Include LowPriority benchmarks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore Sia.Math.Benchmarks/Sia.Math.Benchmarks.csproj

      - name: Run benchmarks
        run: |
          exclude=()
          [ "${{ inputs.include_high_priority }}" = "false" ] && exclude+=(HighPriority)
          [ "${{ inputs.include_normal }}" = "false" ] && exclude+=(Normal)
          [ "${{ inputs.include_low_priority }}" = "false" ] && exclude+=(LowPriority)

          args=()
          [ ${#exclude[@]} -gt 0 ] && args+=(--excludeCategories "${exclude[@]}")

          dotnet run --project Sia.Math.Benchmarks/Sia.Math.Benchmarks.csproj --configuration Release -- \
            --filter "*" --job short --artifacts "${{ runner.temp }}/bench-results" "${args[@]}"

      - name: Summarize benchmark results
        if: always()
        run: |
          {
            echo "## Benchmarks"
            echo

            shopt -s nullglob
            reports=("${{ runner.temp }}/bench-results/results/"*-report-github.md)

            if [ ${#reports[@]} -eq 0 ]; then
              echo "No benchmark reports were produced."
            else
              for report in "${reports[@]}"; do
                name="$(basename "$report" -report-github.md)"
                asm="${{ runner.temp }}/bench-results/results/${name}-asm.md"

                echo "### $name"
                echo
                cat "$report"
                echo

                if [ -f "$asm" ]; then
                  echo "<details>"
                  echo "<summary>ASM</summary>"
                  echo
                  cat "$asm"
                  echo
                  echo "</details>"
                  echo
                fi
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
